<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS ne lit pas les icônes du manifest.json : balise dédiée obligatoire -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Patrium" />

    <title>Patrium</title>

    <!--
      Signature du réseau Orbit, servie depuis NOTRE origine.

      Elle était chargée depuis le hub (https://orbit-umber-sigma.vercel.app).
      Un script tiers s'exécute avec les mêmes droits que l'application : il
      peut lire le localStorage, donc le jeton de session Supabase et toutes
      les données patrimoniales. Sur une application dont la promesse centrale
      est la confidentialité, faire dépendre cette promesse de la disponibilité
      et de l'intégrité d'un autre déploiement n'était pas tenable — et sans
      `integrity`, aucun changement de contenu n'aurait été détecté.

      Le fichier est donc une copie locale : pour le mettre à jour, la recopier
      depuis le hub. Bénéfice secondaire, il est désormais mis en cache par le
      service worker et l'en-tête survit hors ligne.
    -->
    <script src="/orbit-header.js" defer></script>
  </head>
  <body class="bg-slate-950">
    <!-- "static" au lieu de "compact" : le header défile au lieu de rester
         collé, pour ne pas doubler la barre de navigation de l'app. -->
    <orbit-header app-name="Patrium" theme="finance" static></orbit-header>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
