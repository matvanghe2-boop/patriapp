<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS ne lit pas les icônes du manifest.json : balise dédiée obligatoire -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Patrium" />

    <title>Patrium</title>

    <!-- Signature du réseau Orbit — composant hébergé par le hub -->
    <script src="https://orbit-umber-sigma.vercel.app/orbit-header.js" defer></script>
  </head>
  <body class="bg-slate-950">
    <!-- "static" au lieu de "compact" : le header défile au lieu de rester
         collé, pour ne pas doubler la barre de navigation de l'app. -->
    <orbit-header app-name="Patrium" theme="finance" static></orbit-header>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
